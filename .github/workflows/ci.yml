name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest migrated to 26.04, which no longer ships a 3.9
          # interpreter, so setup-python refuses that leg before any test runs.
          # 3.9 keeps its coverage here rather than being dropped from the
          # version range the README promises.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fail on syntax warnings
        run: python -W error::SyntaxWarning -m compileall -q rt tests examples
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate the suite
        run: python -m rt validate --suite suites/owasp_llm01.jsonl
      - name: Offline self-test against the good mock
        run: python -m rt run --suite suites/owasp_llm01.jsonl --mock --mock-mode good --max-asr 0.0
      - name: The host plugin contract answers
        run: |
          python -m rt plugin-manifest > /dev/null
          python -m rt plugin-run --suite suites/owasp_llm01.jsonl --mock --mock-mode good > /dev/null
      - name: The leaky mock fails its gate, as it should
        run: |
          if python -m rt run --suite suites/owasp_llm01.jsonl --mock --mock-mode leaky --max-asr 0.1; then
            echo "the leaky mock passed a gate it must fail" && exit 1
          fi
          echo "leaky mock correctly failed the gate"
