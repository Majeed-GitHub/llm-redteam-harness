name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest migrated to 26.04, which no longer ships a 3.9
          # interpreter, so setup-python refuses that leg before any test runs.
          # 3.9 keeps its coverage here rather than being dropped from the
          # version range the README promises.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fail on syntax warnings
        run: python -W error::SyntaxWarning -m compileall -q rt tests examples
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate the suite
        run: python -m rt validate --suite suites/owasp_llm01.jsonl
      - name: Offline self-test against the good mock
        run: python -m rt run --suite suites/owasp_llm01.jsonl --mock --mock-mode good --max-asr 0.0
      - name: The host plugin contract answers
        run: |
          python -m rt plugin-manifest > /dev/null
          python -m rt plugin-run --suite suites/owasp_llm01.jsonl --mock --mock-mode good > /dev/null
      - name: The leaky mock fails its gate, as it should
        run: |
          if python -m rt run --suite suites/owasp_llm01.jsonl --mock --mock-mode leaky --max-asr 0.1; then
            echo "the leaky mock passed a gate it must fail" && exit 1
          fi
          echo "leaky mock correctly failed the gate"
      - name: Validate the MCP poisoning suite
        run: python -m rt validate --suite suites/mcp_schema.jsonl
      - name: A poisoned agent fails the MCP suite, as it must
        run: |
          if python -m rt agent --suite suites/mcp_schema.jsonl --mock --mock-mode agent-vulnerable --max-asr 0.5; then
            echo "the vulnerable fixture passed a gate it must fail" && exit 1
          fi
          echo "vulnerable fixture correctly failed the gate"
      - name: A safe agent passes the same suite
        run: python -m rt agent --suite suites/mcp_schema.jsonl --mock --mock-mode agent-safe --max-asr 0.0
      - name: The MCP linter rejects a poisoned config, as it must
        run: |
          if python -m rt scan-mcp examples/poisoned_mcp.json; then
            echo "the poisoned config passed the linter" && exit 1
          fi
          echo "poisoned config correctly rejected"
      - name: A defense is measured, not assumed
        run: |
          python -m rt agent --suite suites/mcp_schema.jsonl --mock --mock-mode agent-vulnerable \
            --defense sanitize-schemas --max-asr 0.5
          echo "sanitizing schemas brought attack success under the gate"
      - name: Live MCP introspection runs against a real subprocess
        run: python -m unittest tests.test_mcp_live -v
      - name: Reports render and parse
        run: |
          python -m rt agent --suite suites/mcp_schema.jsonl --mock --mock-mode agent-safe \
            --format sarif --report out.sarif
          python -m rt agent --suite suites/mcp_schema.jsonl --mock --mock-mode agent-safe \
            --format html --report out.html
          python -c "import json; json.load(open('out.sarif'))"
          test -s out.html
          echo "sarif and html rendered"
